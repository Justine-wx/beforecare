          const recordId = `${Date.now()}-${Math.random().toString(16).slice(2)}`; const newSignals = [...selected, ...option].filter((tag) => tag.group !== 'none').map((tag) => ({...tag, activity:activity.title, partner:activity.line.partner, recordId}));
          const note = state.freeNote.trim(); state.signals = [...state.signals, ...newSignals];
          if (note) state.notes = [...state.notes, {activity:activity.title, text:note, partner:activity.line.partner, recordId}];
          if (activity.line.partner && state.shareMode !== 'private' && (newSignals.length || note)) state.sharedEntries = [...state.sharedEntries, {activity:activity.title, tags:newSignals.map((signal) => signal.name), note, mode:state.shareMode}];
          if (newSignals.length || note) state.explorations = [...state.explorations, {id:recordId, activity:activity.title, partner:activity.line.partner, at:Date.now()}];

        }
        if (button.dataset.skip !== undefined) { recordInterruption('这次先不记'); state.stepTimerEndsAt = 0; state.screen = 'map'; render(); return; }
        if (button.dataset.careSave !== undefined) { const note = state.freeNote.trim(); if (note) state.notes = [...state.notes, {activity:current().title, text:note, partner:current().line.partner}]; state.freeNote = ''; state.screen = 'home'; render(); notify('今天，你照顾过自己了。'); return; }
        if (button.dataset.deleteNote !== undefined) { const index = Number(button.dataset.deleteNote); const removed = state.notes[index]; state.notes = state.notes.filter((_, item) => item !== index); if (removed?.recordId && !state.signals.some((signal) => signal.recordId === removed.recordId)) state.explorations = state.explorations.filter((item) => item.id !== removed.recordId); render(); notify('这句话已经收起来了。'); return; }
        if (button.dataset.deleteSignal !== undefined) { state.pendingDeleteSignal = Number(button.dataset.deleteSignal); render(); return; }
        if (button.dataset.confirmDelete !== undefined) { const index = state.pendingDeleteSignal; const removed = state.signals[index]; state.signals = state.signals.filter((_, item) => item !== index); if (removed?.recordId && !state.signals.some((signal) => signal.recordId === removed.recordId) && !state.notes.some((note) => note.recordId === removed.recordId)) state.explorations = state.explorations.filter((item) => item.id !== removed.recordId); state.pendingDeleteSignal = null; render(); return; }
        if (button.dataset.deleteShared !== undefined) { const index = Number(button.dataset.deleteShared); state.sharedEntries = state.sharedEntries.filter((_, item) => item !== index); render(); notify('这条分享已经撤回。'); return; }
        if (button.dataset.connect !== undefined) { notify('邀请链接已准备好；是否连接，始终由你决定。'); return; }
        if (button.dataset.resume !== undefined && state.lastIncomplete) { state.activityId = state.lastIncomplete.activityId; state.lineId = current().line.id; state.step = Math.max(0, state.lastIncomplete.step - 1); state.paused = false; startStepTimer(current()); state.resumeDismissed = true; keepScreenAwake(); state.screen = 'guide'; render(); playCurrentGuideVoice(); return; }
        if (button.dataset.dismissResume !== undefined) { state.resumeDismissed = true; render(); return; }
      });
      root.addEventListener('change', (event) => { if (event.target.matches('[data-privacy-known]')) { state.privacyKnown = event.target.checked; render(); } });
      root.addEventListener('input', (event) => {
        if (event.target.matches('[data-note]')) state.freeNote = event.target.value;
        if (event.target.matches('[data-shared-note]')) { const index = Number(event.target.dataset.sharedNote); if (state.sharedEntries[index]) state.sharedEntries[index].note = event.target.value; }
        if (event.target.matches('[data-signal]')) { const index = Number(event.target.dataset.signal); if (state.signals[index]) state.signals[index].name = event.target.value; }
      });
      window.addEventListener('pagehide', () => { audio.stopMusic(); audio.stopVoice(); if (state.screen === 'guide') recordInterruption('今天，停在了这里。'); });
      render();
    })();
